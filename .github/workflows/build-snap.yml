name: Snap build

# build the classic-confinement Snap package only for release pull requests:
#   - source (head) branch must be rel/<major.minor.patch>
#   - target (base) branch must be master
on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare classic-confinement snapcraft.yaml
        # build/snap/snapcraft.yaml is the STRICT (Snap Store) manifest,
        # BUT the downloadable GitHub Release build is the CLASSIC confinement variant
        run: |
          cp -vf build/snap/snapcraft.yaml snapcraft.yaml
          build/snap/apply-classic.sh snapcraft.yaml

      - name: Install LXD
        # snapcore/action-build installs LXD itself, but w/o any retry: a Snap
        # Store CDN hiccup (HTTP 5xx while downloading) then fails the whole
        # build. Install LXD here instead - w/ retries - so that the action
        # finds it in place and only refreshes it, which it DOES tolerate
        # failing (see its ensureLXD()).
        run: |
          if [ -x /snap/bin/lxd ]; then
            echo "DONE: LXD is already installed"
            exit 0
          fi
          for attempt in 1 2 3; do
            if sudo snap install lxd; then
              echo "DONE: LXD installed on attempt ${attempt}"
              exit 0
            fi
            echo "WARNING: LXD installation attempt ${attempt} failed - retrying in 60s"
            sleep 60
          done
          echo "ERROR: unable to install LXD"
          exit 1

      - name: Build Snap package
        id: snapcraft
        uses: snapcore/action-build@v1

      - name: Archive push build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mindforger-snap-classic
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error
