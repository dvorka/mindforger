name: macOS build

# build the macOS .dmg only for release pull requests:
#   - source (head) branch must be rel/<major.minor.patch>
#   - target (base) branch must be main
on:
  pull_request:
    branches: [main]

jobs:
  build:
    # macos-15-intel is an Intel (x86_64) runner; required because Qt5 official
    # builds with WebEngine only exist for x86_64 macOS - Apple Silicon runners
    # have Homebrew Qt5 without webengine support.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 5.15 with WebEngine
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtwebengine'

      - name: Install build tools
        run: brew install ccache

      - name: Build dependency - cmark-gfm
        run: cd deps/cmark-gfm && mkdir -v build && cd build && cmake -DCMARK_TESTS=OFF -DCMARK_SHARED=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 .. && cmake --build .

      - name: Run QMake
        run: pwd ; qmake -r "CONFIG+=mfci" mindforger.pro

      - name: Run Make
        run: make -j 4

      - name: Build Disk iMaGe
        run: cd build/macos && ./dmg-package-build.sh ci

      - name: Archive push build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-ci-build
          path: app/*.dmg
