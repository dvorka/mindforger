# Relocates Qt's compiled-in /usr prefix to this snap's own bundled Qt install.
#
# Qt has NO environment variable to override where Qt WebEngine looks for its
# resources/locales data (verified against the actual linked libQt5WebEngineCore.so.5,
# which only recognizes QTWEBENGINE_CHROMIUM_FLAGS, QTWEBENGINE_DICTIONARIES_PATH,
# QTWEBENGINE_DISABLE_GPU_THREAD, QTWEBENGINE_DISABLE_SANDBOX,
# QTWEBENGINE_ENABLE_LINUX_ACCESSIBILITY, QTWEBENGINEPROCESS_PATH and
# QTWEBENGINE_REMOTE_DEBUGGING - no QTWEBENGINE_RESOURCES_PATH/LOCALES_PATH exists).
# Instead it derives its resources/locales paths from QLibraryInfo's Data/Translations
# paths, which qt.conf is the documented, supported way to override.
#
# Absolute paths (not relative to qt.conf's own directory) are used deliberately:
#   - Setting only Prefix is NOT enough - verified empirically with the real qmake
#     binary that when Data/Translations/LibraryExecutables are left unset, Qt falls
#     back to its own generic per-key defaults (Data = Prefix itself, Translations =
#     Prefix/translations, LibraryExecutables = Prefix/libexec), NOT this Debian Qt
#     build's actual layout (share/qt5, share/qt5/translations,
#     lib/x86_64-linux-gnu/qt5/libexec) - so each path below is set explicitly.
#   - Relative paths for Data/Translations compose with Prefix in a confusing way
#     (verified empirically to produce a broken path like "/../share/qt5" once qt.conf
#     is nested a few directories deep, as it needs to be for the QtWebEngineProcess
#     copy below) - plain absolute paths sidestep that entirely.
#   - $SNAP cannot be used literally (qt.conf has no environment variable expansion),
#     and $SNAP's own absolute value changes on every revision (x1 -> x2 -> ...), but
#     snapd maintains /snap/mindforger/current as a symlink to whichever revision is
#     currently active (confirmed against another installed snap's own layout on this
#     machine), so hardcoding that path here is safe and stable across revisions.
#
# This SAME file is staged at two locations (see the launcher part in snapcraft.yaml),
# because Qt only looks for qt.conf next to the currently running executable, and Qt
# WebEngine runs as two separate binaries that each independently load resources:
#   - bin/qt.conf                                          (next to bin/mindforger)
#   - usr/lib/x86_64-linux-gnu/qt5/libexec/qt.conf   (next to bin/QtWebEngineProcess)
[Paths]
Prefix = /snap/mindforger/current/usr
Data = /snap/mindforger/current/usr/share/qt5
Translations = /snap/mindforger/current/usr/share/qt5/translations
LibraryExecutables = /snap/mindforger/current/usr/lib/x86_64-linux-gnu/qt5/libexec
