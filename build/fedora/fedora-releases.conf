# MindForger Fedora releases
#
# This file is the ONE AND ONLY list of Fedora releases for which MindForger
# is built in Fedora COPR https://copr.fedorainfracloud.org/coprs/dvorka/mindforger/
#
# It is read by:
#   - build/fedora/fedora-copr.sh ... local .rpm builds, COPR builds, verification
#
# Columns (whitespace separated, one release per line, # starts a comment):
#
#   number  Fedora release number (https://fedoraproject.org/wiki/Releases) - it
#           is also the Docker image tag (fedora:<number>) and the COPR chroot
#           name part (fedora-<number>-<arch>)
#   status  supported ... new MindForger versions are BUILT for this release
#           frozen    ... release is no longer built (e.g. Fedora dropped
#                         qt5-qtwebengine), COPR keeps serving already built
#                         packages until it retires the EOL chroot
#
# How to:
#   - ADD a new Fedora release: add a line with status "supported", enable its
#     chroots in COPR, then run `make distro-fedora-add-new-version` (see
#     build/fedora/README.md)
#   - FREEZE a Fedora release: change its status to "frozen"
#   - EOL Fedora release: delete its line (COPR removes EOL chroots itself)
#
# Order: newest release first.

# number  status
44        supported
43        supported

