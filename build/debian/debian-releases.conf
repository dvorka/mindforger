# MindForger Debian releases
#
# This file is the ONE AND ONLY list of Debian releases for which MindForger
# provides Debian PPA at https://www.mindforger.com/debian-ppa/<codename>/
#
# It is read by:
#   - build/debian/debian-ppa.sh          ... PPA management (aptly)
#   - build/docker/debian-deb/build-deb.sh ... Docker-based .deb builds
#
# Columns (whitespace separated, one release per line, # starts a comment):
#
#   number        Debian release number (https://www.debian.org/releases/)
#   codename      Debian release codename - it is also the PPA name, the apt
#                 distribution name and the Docker image tag (debian:<codename>)
#   status        supported ... new MindForger versions are BUILT for this
#                               release and ADDED to its PPA
#                 frozen    ... release is no longer built, its PPA is kept
#                               published (re-signed from the .deb archive
#                               only), no new MindForger versions are added
#   html-backend  Markdown to HTML rendering backend for Docker build:
#                 webkit    ... Qt WebKit (CONFIG+=mfwebkit, checked-in
#                               build/debian/debian/control)
#                 webengine ... Qt WebEngine (MF default backend, required
#                               since trixie where Qt WebKit is gone)
#                 -         ... release cannot be built anymore (frozen)
#
# How to:
#   - ADD a new Debian release: add a line with status "supported", then
#     run `make distro-debian-add-new-version` (see build/debian/README.md)
#   - FREEZE a Debian release: change its status to "frozen"
#
# Order: newest release first (used also for the PPA index.html).

# number  codename  status     html-backend
13        trixie    supported  webengine
12        bookworm  supported  webkit
11        bullseye  frozen     webkit
10        buster    frozen     -
9         stretch   frozen     -

# eof
